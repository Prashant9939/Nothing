<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Variable-range request = one font file instead of five. Loaded as a
         normal stylesheet: the old media="print" onload swap was blocked by
         our CSP (script-src has no unsafe-inline), which silently left every
         page on fallback system fonts. display=swap keeps first paint on the
         fallback until the webfont lands. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Editorial bento type system (student portal): Space Grotesk display,
         Plus Jakarta Sans body, JetBrains Mono data labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>IQIntern - Internship Evaluation Platform</title>
    <meta name="description" content="Professional Training & Evaluation Hub. Acquire verified skills and accelerate your career." />
    <!-- Navbar logo is the LCP candidate: without a preload it only starts
         downloading after the entry bundle parses and React mounts. -->
    <link rel="preload" as="image" href="/logo/logo-full.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
