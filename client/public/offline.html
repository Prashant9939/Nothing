<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are currently offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fff7ed 0%, #f9fafb 100%);
        color: #111827;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 420px;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        background: #ffedd5;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: #6b7280;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      button {
        background: #f97316;
        color: #ffffff;
        border: none;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      button:hover {
        background: #ea580c;
      }
      svg {
        stroke: #f97316;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>You are currently offline</h1>
      <p>
        Please check your internet connection and try again. This page will reload automatically once
        you're back online.
      </p>
      <button id="retry" type="button">Try Again</button>
    </div>
    <script src="/offline.js"></script>
  </body>
</html>
