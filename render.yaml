# Render Blueprint: deploys the whole app (Express API + built React client)
# as a single free web service.
# Dashboard -> New -> Blueprint -> select this repo -> Apply.
services:
  - type: web
    name: iqintern
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/auth/internships
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Required: server refuses to start without it (server.js:3)
      - key: JWT_SECRET
        generateValue: true
      # Admin login password, generated once — read it from the
      # Environment tab of your Render service after the first deploy.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Supabase Postgres connection string. IMPORTANT: paste the SESSION
      # pooler URI (Dashboard -> Connect -> Connection string -> URI ->
      # Session pooler), e.g. postgresql://postgres.<ref>:<pass>@aws-0-<region>
      # .pooler.supabase.com:5432/postgres?sslmode=require
      # Do NOT use the direct `db.<ref>.supabase.co` host: it is IPv6-only
      # and Render has no IPv6 route -> "Database initialization failed ...
      # network unreachable".
      # Set it in the Render dashboard: Environment -> DATABASE_URL -> Save.
      - key: DATABASE_URL
        sync: false
      # No Supabase keys on Render — legacy mirror stays off
      - key: SUPABASE_SYNC
        value: "false"
